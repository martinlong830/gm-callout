name: Schedule sync v2 invariants

on:
  push:
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run schedule sync v2 invariant tests
        run: npm run test:schedule-v2
